name: Tag and Release

on:
  push:
    branches: ['master', 'maveth/pow-0.5.0-normal']
    paths-ignore: ['*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: read
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download s9pk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: datum_*
          merge-multiple: true
          path: dist

      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'master' && 'pow_0.5.0_3' || 'pow_0.5.0_2' }}
          name: ${{ github.ref_name == 'master' && 'DATUM Gateway StartOS #pow:0.5.0:3 (riptide patches + filter)' || 'DATUM Gateway StartOS #pow:0.5.0:2 (stock v0.5.0beta + filter)' }}
          body_path: release-notes/sideload.md
          files: dist/*.s9pk
          make_latest: ${{ github.ref_name == 'master' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
