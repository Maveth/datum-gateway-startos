name: Tag and Release

on:
  push:
    branches: ['master']
    paths-ignore: ['*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: read
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download s9pk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: datum_*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pow_0.5.0_1
          name: 'DATUM Gateway StartOS #pow:0.5.0:1 (riptide_current_gw_reuse)'
          body: |
            RIPTIDE gateway `riptide_current_gw_reuse` (`1dd17cc`): Luke v0.5 plus refetch, replace-current-job, and coinbaser reuse default on.

            ### Which file
            | File | Use on |
            |------|--------|
            | datum_aarch64.s9pk | Raspberry Pi / ARM |
            | datum_x86_64.s9pk | Intel/AMD |

            ### Install
            1. StartOS → Sideload → upload the matching `.s9pk`
            2. This upgrades the existing Datum Gateway (`id: datum`)
            3. Set the pool host and paste the 128-hex pool pubkey

            Source: https://github.com/Maveth/datum_gateway/tree/riptide_current_gw_reuse
          files: dist/*.s9pk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
