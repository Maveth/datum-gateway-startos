name: Build

on:
  workflow_dispatch:
  push:
    branches: ['maveth/pow-0.4.1-18-multicoinbase', 'master']
    paths-ignore: ['*.md']
  pull_request:
    paths-ignore: ['*.md']
    branches: ['master']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    # Sideload build: CI generates a throwaway signing key when DEV_KEY is unset.
